version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: glitrai
    ports:
      - "5432:5432"
    volumes:
      - glitrai_pgdata:/var/lib/postgresql/data
      - ./backend/migrations/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/glitrai
      PORT: 4000
    ports:
      - "4000:4000"
    volumes:
      - glitrai_uploads:/app/backend/src/uploads
      - glitrai_generated:/app/backend/generated

volumes:
  glitrai_pgdata:
  glitrai_uploads:
  glitrai_generated:
